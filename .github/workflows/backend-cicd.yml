name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: './package-lock.json'

    - name: Install Dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Build TypeScript Project
      run: npm run build

  deploy:
    name: Deploy to Production Server
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Deploy via SSH & PM2
      uses: appleboy/ssh-action@v1.0.3
      env:
        ENV_FILE: ${{ secrets.ENV_FILE }}
        FIREBASE_JSON: ${{ secrets.FIREBASE_JSON }}
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        command_timeout: 30m
        envs: ENV_FILE,FIREBASE_JSON
        script: |
          cd /home/ec2-user/project/hinchmart-backend
          
          # Write environment variables if provided
          if [ -n "$ENV_FILE" ]; then
            echo "$ENV_FILE" > .env
          fi
          
          if [ -n "$FIREBASE_JSON" ]; then
            echo "$FIREBASE_JSON" > serviceAccountKey.json
          fi
          
          # Pull latest code
          git pull origin main
          
          # Install dependencies & build
          npm install
          
          # Generate Prisma Client & seed database
          npx prisma generate
          npx tsx prisma/seed-script.ts
          
          # Build TypeScript
          npm run build
          
          # Graceful PM2 restart
          pm2 restart hinchmart-api || pm2 start dist/server.js --name "hinchmart-api"
          pm2 save
