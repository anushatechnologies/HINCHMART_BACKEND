name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: './package-lock.json'

    - name: Install Dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    # - name: Run Linter (Optional)
    #   run: npm run lint

    # - name: Run Tests (Optional)
    #   run: npm test

  deploy:
    name: Deploy to Production Server
    needs: build-and-test
    # Only run deploy on push to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Deploy via SSH & PM2
      uses: appleboy/ssh-action@v1.0.3
      env:
        ENV_FILE: ${{ secrets.ENV_FILE }}
        FIREBASE_JSON: ${{ secrets.FIREBASE_JSON }}
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        command_timeout: 30m
        envs: ENV_FILE,FIREBASE_JSON
        script: |
          cd /home/ec2-user/project/hinchmart-backend
          
          # Write the environment variables from GitHub Secrets to the .env file
          echo "$ENV_FILE" > .env
          
          # Write the Firebase Admin SDK credentials from GitHub Secrets
          echo "$FIREBASE_JSON" > serviceAccountKey.json
          
          # Pull latest changes from GitHub
          git pull origin main
          
          # Install dependencies securely
          npm ci
          
          # Apply database migrations & generate client
          npx prisma generate
          npx prisma db push --accept-data-loss
          
          # Compile the TypeScript code
          npx tsc
          
          # Restart the PM2 process gracefully, or start it if it doesn't exist
          pm2 restart hinchmart-api || pm2 start dist/server.js --name "hinchmart-api"
          pm2 save
